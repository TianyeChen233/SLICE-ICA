[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Standalone CLI files bootstrap their sibling modules before importing them.
"classification/scripts/run_hybrid_ablation_trial.py" = ["E402"]
"classification/scripts/infer_frozen.py" = ["E402"]
"tests/test_protocol.py" = ["E402"]
"tests/test_reporting.py" = ["E402"]
